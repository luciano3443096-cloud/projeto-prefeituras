name: Rodar sites das prefeituras de Goiás

on:
  workflow_dispatch:

jobs:
  buscar-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github_sites.txt

      - name: Rodar script
        run: python achar_sites_prefeituras_goias_github.py

      - name: Enviar resultados como artifact
        uses: actions/upload-artifact@v4
        with:
          name: resultados-sites-goias
          path: |
            sites_prefeituras_goias_encontrados.csv
            candidatos_sites_prefeituras_goias.csv
